name: Build Golden Fortune APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare game
        shell: bash
        run: |
          set -euo pipefail

          ZIP="golden_fortune_30_browser.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Game archive not found: $ZIP"
            exit 1
          fi

          mkdir -p extracted
          unzip -qo "$ZIP" -d extracted

          GAME=$(find extracted -type f -name index.html -print -quit)

          if [ -z "$GAME" ]; then
            echo "index.html not found"
            exit 1
          fi

          mkdir -p app/src/main/assets/www
          cp -R "$(dirname "$GAME")/." app/src/main/assets/www/

          test -f app/src/main/assets/www/index.html
          echo "Golden Fortune 30.0 ready"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/goldenfortune/game

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = 'GoldenFortune'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.goldenfortune.game'
            compileSdk 35

            defaultConfig {
              applicationId 'com.goldenfortune.game'
              minSdk 24
              targetSdk 28
              versionCode 30
              versionName '30.0'
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:label="Golden Fortune"
              android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:usesCleartextTraffic="false">
              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/goldenfortune/game/MainActivity.java <<'EOF'
          package com.goldenfortune.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView web;

            @Override
            public void onCreate(Bundle state) {
              super.onCreate(state);

              web = new WebView(this);
              web.setWebViewClient(new WebViewClient());

              web.getSettings().setJavaScriptEnabled(true);
              web.getSettings().setDomStorageEnabled(true);
              web.getSettings().setAllowFileAccess(true);

              setContentView(web);

              web.loadUrl("file:///android_asset/www/index.html");
            }

            @Override
            public void onBackPressed() {
              if (web.canGoBack()) {
                web.goBack();
              } else {
                super.onBackPressed();
              }
            }

            @Override
            protected void onDestroy() {
              if (web != null) {
                web.destroy();
              }
              super.onDestroy();
            }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Golden-Fortune-30-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
